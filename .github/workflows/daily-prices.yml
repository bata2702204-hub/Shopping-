name: Daily real prices

# Pulls REAL prices from the chains' price-transparency files every morning, rebuilds the app
# into docs/ and pushes to main so GitHub Pages serves the new prices.
on:
  schedule:
    # GitHub cron is UTC only, and GitHub often starts scheduled runs hours late. So several runs
    # are scheduled through the day and the guard below lets the FIRST one from 05:00 Israel time
    # (UTC+2 winter / UTC+3 summer) do the update; later ones see today's commit and skip.
    - cron: '0 3,5,8,11,14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30   # enough history for the guard to see today's commits

      - name: Guard — once per Israel day, from 05:00 (manual runs always go)
        id: guard
        run: |
          today=$(TZ=Asia/Jerusalem date +%F)
          hour=$(TZ=Asia/Jerusalem date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$hour" -lt 5 ]; then
            echo "Israel time ${hour}:xx — too early, a later scheduled run will update today."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif git log --since="36 hours ago" --format=%s | grep -qx "Daily real prices ${today}"; then
            echo "Already updated today (${today})."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: |
          pip install --quiet requests lxml
          npm ci

      - name: Fetch real prices
        if: steps.guard.outputs.run == 'true'
        env:
          PUBLISHEDPRICES_ENABLED: ${{ vars.PUBLISHEDPRICES_ENABLED }}
        run: python scripts/fetch_real_prices.py

      - name: Tag departments
        if: steps.guard.outputs.run == 'true'
        run: node scripts/enrich_prices.mjs

      - name: Test and build
        if: steps.guard.outputs.run == 'true'
        run: |
          npm test
          npm run build

      - name: Commit and push
        if: steps.guard.outputs.run == 'true'
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/real_prices.json docs
          if git diff --cached --quiet; then
            echo "No price changes today."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Daily real prices $(TZ=Asia/Jerusalem date +%Y-%m-%d)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask GitHub Pages to rebuild
        if: steps.push.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
